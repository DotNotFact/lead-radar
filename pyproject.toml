[project]
name = "lead-radar"
version = "0.1.0"
description = "Персональная система поиска заказов и управления действиями"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "aiogram>=3.10,<4",
    "httpx>=0.27",
    "selectolax>=0.3",
    "feedparser>=6.0",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "types-pyyaml",
    "respx>=0.21",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "telethon.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "feedparser.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
