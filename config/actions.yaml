# Шаблоны повторяющихся действий владельца. Владелец редактирует значения N и даты под себя.
# recurrence: cron-подобная строка или null для разовых задач с due_date.

recurring:
  - title: "Проверить входящие сообщения на Avito"
    recurrence: "daily"
    priority: 2
    expected_value: "Пропущенный отклик на Avito — это упущенный тёплый лид, ищущий именно тебя"

  - title: "Откликнуться на N удалённых вакансий .NET"
    recurrence: "daily"
    priority: 2
    expected_value: "N задаётся владельцем — целевое количество откликов в день"

  - title: "Проверить лиды с оценкой выше порога"
    recurrence: "daily"
    priority: 1
    expected_value: "Свежие лиды выше score_threshold теряют актуальность за часы"

  - title: "Поднять объявление на Avito"
    recurrence: "every_3_days"
    priority: 3
    expected_value: "Поднятие объявления возвращает его в топ выдачи"

  - title: "Написать N старым заказчикам"
    recurrence: "every_3_days"
    priority: 3
    expected_value: "N задаётся владельцем — повторные заказы дешевле новых лидов"

  - title: "Написать N перегруженным фрилансерам на предмет субподряда"
    recurrence: "every_3_days"
    priority: 3
    expected_value: "N задаётся владельцем — канал субподряда без затрат на поиск лидов"

  - title: "Обновить резюме на hh (поднятие в поиске)"
    recurrence: "weekly"
    priority: 2
    expected_value: "Поднятие резюме увеличивает видимость у рекрутёров"

  - title: "Проверить новые Telegram-чаты для добавления в sources.yaml"
    recurrence: "weekly"
    priority: 4
    expected_value: "Больше источников — меньше шанс пропустить нишевый заказ"

  - title: "Ревью статистики конверсии (/stats)"
    recurrence: "weekly"
    priority: 4
    expected_value: "Понимание, какие источники и ниши реально работают"

seasonal:
  - title: "Переписать объявления под пересдачи и набор учеников"
    activate_on: "08-25"
    priority: 2
  - title: "Переписать объявления под курсовые"
    activate_on: "09-25"
    priority: 2
  - title: "Переписать объявления под дипломы и сессию"
    activate_on: "11-25"
    priority: 2
  - title: "Переписать заголовок Avito под срочность (конец августа)"
    activate_on: "08-25"
    priority: 3
  - title: "Переписать заголовок Avito под срочность (конец ноября)"
    activate_on: "11-25"
    priority: 3
  - title: "Переписать заголовок Avito под срочность (конец декабря)"
    activate_on: "12-25"
    priority: 3

one_off:
  - title: "Заполнить анкету репетитора"
    due_date: null
    priority: 3
  - title: "Подать заявку наставником на онлайн-курсы"
    due_date: null
    priority: 3
  - title: "MANUAL_DECISION_REQUIRED: чеклист по зарубежным площадкам и криптоплатежам"
    due_date: null
    priority: 4
    checklist:
      - "проверить актуальный статус доступности площадок для резидентов РФ"
      - "проверить актуальный правовой режим расчётов в криптовалюте (правила менялись, требуется свежая проверка)"
      - "определить налоговый статус для внешних поступлений (самозанятость / ИП)"
      - "только после этого — регистрация и первый заказ"
    note: "Не автоматизируется. Не кодировать ничего здесь до закрытия чеклиста владельцем."
