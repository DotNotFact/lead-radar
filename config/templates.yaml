# Шаблоны первого ответа. Скорость реакции - половина конверсии, поэтому не пишем с нуля
# каждый раз. /templates - список, /template <имя> - получить текст (бот пришлёт сообщением,
# дальше копируешь и правишь под конкретный заказ вручную - система сама никому не пишет,
# инвариант 1).

templates:
  hh_response:
    title: "Отклик на вакансию (hh.ru)"
    text: |
      Добрый день!

      Заинтересовала ваша вакансия. Коммерческий опыт с C# / ASP.NET Core / PostgreSQL — 3+ года,
      есть опыт [подставить: доработки легаси / интеграций / API].

      Готов обсудить детали и сроки. Резюме и портфолио — по запросу.

  kwork_response:
    title: "Отклик на проект (Kwork)"
    text: |
      Здравствуйте! Готов взяться за задачу.

      По срокам: [подставить]. По цене: [подставить]. Уточните, пожалуйста, [ключевой вопрос
      по ТЗ], чтобы точнее оценить объём.

  telegram_order:
    title: "Отклик в чате (Telegram)"
    text: |
      Здравствуйте! Пишу по вашему заказу выше.

      Стек — C# / .NET, есть релевантный опыт. Могу начать [когда]. Расскажите чуть подробнее
      про [уточнение], и я скажу точный срок и стоимость.

  followup_silence:
    title: "Напоминание после тишины"
    text: |
      Добрый день! Возвращаюсь к нашему разговору по проекту — актуальна ли ещё задача?
      Если да, готов продолжить обсуждение.

  generic_quick:
    title: "Быстрый универсальный ответ"
    text: |
      Здравствуйте! Заинтересовал ваш заказ, есть релевантный опыт (C# / .NET). Готов обсудить
      детали — сроки, бюджет, объём.
