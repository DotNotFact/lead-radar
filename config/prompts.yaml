# Промпты для внешнего ИИ (Claude/ChatGPT и т.п.) — система никуда их сама не отправляет,
# это готовые тексты для копирования, тот же принцип, что config/templates.yaml для ответов
# заказчикам (инвариант 1: никакого автоматического контакта/действия без человека).
# /prompts — список, /prompt <имя> — получить текст.

prompts:
  lead_batch_for_ai:
    title: "Экспорт лидов -> ИИ (подставляется автоматически в /export_ai)"
    text: |
      Ниже — список фриланс-заказов, отобранных как выполнимые целиком с помощью ИИ (небольшой
      бюджет, тип задачи — скрипт/парсер/автоматизация/простой сайт и т.п., без созвонов и
      постоянного контроля со стороны заказчика).

      Для каждого заказа:
      1. Оцени, можешь ли выполнить его полностью самостоятельно, без уточнений у заказчика.
      2. Если да — предложи готовое решение (код, файл, текст) прямо здесь.
      3. Если нужны уточнения — сформулируй короткий список вопросов заказчику вместо решения.
      4. Если задача не по силам целиком — так и скажи: "не подходит для полностью
         автоматического выполнения" — и объясни, почему.

      Заказы:

  freelance_profile:
    title: "Профиль на фриланс-бирже (Freelancer.com/Upwork и т.п.)"
    text: |
      Составь профессиональное описание фрилансера (профиль на англоязычной бирже, до 2000
      символов) на основе информации ниже. Тон — уверенный, без воды и клише вроде "passionate"
      и "seamless". Структура: 1-2 предложения о специализации, 3-4 буллета с конкретными
      технологиями/результатами, короткий призыв к действию в конце.

      Информация обо мне:
      - Специализация: [подставить, например "backend-разработка на C#/.NET"]
      - Опыт: [подставить, например "3 года коммерческой разработки"]
      - Ключевые технологии: [подставить]
      - Заметные проекты/результаты: [подставить]
      - Что ищу: [подставить, например "фикс багов, интеграции, автоматизация"]

  client_ready_reply:
    title: "Довести черновик ответа заказчику до готового"
    text: |
      Вот черновик моего ответа заказчику на фриланс-заказе. Сделай его короче, увереннее и без
      канцелярита, сохранив смысл и все конкретные цифры/сроки. Не добавляй ничего от себя, чего
      не было в черновике.

      Черновик:
      [подставить черновик]
